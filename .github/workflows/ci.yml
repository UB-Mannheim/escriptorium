name: CI

on:
  push:
    branches: [ develop ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: escriptorium
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d escriptorium"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_DB: escriptorium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SQL_HOST: localhost
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips default-jdk
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      # CPU-only PyTorch build: PyPI's default index serves multi-GB CUDA wheels
      - name: Install CPU-only PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python dependencies
        run: pip install -r app/requirements.txt
      - name: Run Django tests
        working-directory: app
        run: python manage.py test -v 2 users api versioning imports core escriptorium

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/cache@v6
        with:
          path: front/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}
      - name: Install frontend dependencies
        working-directory: front
        run: npm ci
      - name: Build production frontend
        working-directory: front
        run: npm run production
      - name: Lint frontend
        working-directory: front
        run: npm run lint
      - name: Run JavaScript tests
        working-directory: front
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist
          retention-days: 14
