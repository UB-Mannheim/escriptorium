upstream escriptorium {
    server web:8000;
    # server unix:/usr/src/app/escriptorium/app.sock;
}

upstream websocket {
    server channelserver:5000;
}


server {
    listen 80;
    charset     utf-8;
    client_max_body_size 150M;

    gzip_static  on;
    gzip on;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    include /etc/nginx/mime.types;

    location /ws/ {
        proxy_pass http://websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
    }

    # readiness probe: reports the state of the database, cache and celery
    # broker, so it is kept internal. /health (liveness) stays public, it
    # discloses nothing and the container healthchecks poll it.
    # NB: behind another reverse proxy $remote_addr is that proxy and this
    # allowlist stops meaning anything; such a deployment needs the realip
    # module (set_real_ip_from / real_ip_header).
    location = /health/ready {
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # docker bridge networks
        deny  all;
        access_log off;

        uwsgi_pass  escriptorium;
        include     uwsgi_params;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;

        proxy_pass http://escriptorium;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    location / {
        uwsgi_pass  escriptorium;
        include     uwsgi_params;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;

        proxy_pass http://escriptorium;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_redirect off;
    }

    location /static/ {
        alias /usr/src/app/static/;
    }

    location /favicon.ico {
        alias /usr/src/app/static/images/favicon.ico;
    }

    location /media/ {
        alias /usr/src/app/media/;
    }

    location = /robots.txt {
        alias /usr/src/app/static/robots.txt;
    }
}
