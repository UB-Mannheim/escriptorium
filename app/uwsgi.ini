[uwsgi]
#socket=/usr/src/app/escriptorium/app.sock
#chmod-socket=664
http=:8000
#chdir=%dapp/
chdir=/usr/src/app/
module=escriptorium.wsgi:application
#processes = 4
#threads = 2
#stats = 127.0.0.1:9191
vacuum=True
# Don't raise OSError/log SIGPIPE when the client disconnects before the
# response is fully written (e.g. browser aborts an autosave PUT); the
# request was already processed, the write failure is harmless.
ignore-sigpipe=True
ignore-write-errors=True
disable-write-exception=True
